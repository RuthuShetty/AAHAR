version: "3.9"

# AAHAR — Local Development Stack
# Brings up all cloud dependencies for local development and integration testing.
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up -d postgres redis  # Start only DB + cache
#   docker compose logs -f api    # Follow API logs

services:

  # ─── PostgreSQL 16 + TimescaleDB ──────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aahar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aahar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aahar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aahar -d aahar"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_preload_libraries=timescaledb
        -c timescaledb.telemetry_level=off
        -c log_min_duration_statement=1000
        -c max_connections=100

  # ─── Redis 7 — sync cursors, rate limits, alert dedupe ───────────────────
  redis:
    image: redis:7-alpine
    container_name: aahar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ─── MinIO — object storage (spectra, images, models, firmware) ──────────
  minio:
    image: minio/minio:latest
    container_name: aahar-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_VOLUMES: /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"

  # ─── MinIO setup — creates buckets on first run ───────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: aahar-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 aahar_admin aahar_minio_dev &&
        mc mb --ignore-existing local/spectra &&
        mc mb --ignore-existing local/images &&
        mc mb --ignore-existing local/models &&
        mc mb --ignore-existing local/firmware &&
        mc mb --ignore-existing local/exports &&
        mc mb --ignore-existing local/lab-reports &&
        mc anonymous set download local/models &&
        echo 'MinIO buckets ready.'
      "

  # ─── EMQX — MQTT broker for silage probe ingestion ───────────────────────
  emqx:
    image: emqx/emqx:5.6.0
    container_name: aahar-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT
      - "8883:8883"    # MQTT/TLS
      - "8083:8083"    # WebSocket
      - "18083:18083"  # Dashboard
    environment:
      EMQX_NAME: aahar_broker
      EMQX_HOST: 127.0.0.1
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_ACL_NOMATCH: deny
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./infra/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── FastAPI cloud service ────────────────────────────────────────────────
  api:
    build:
      context: cloud
      dockerfile: Dockerfile
      target: development
    container_name: aahar-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aahar:aahar_dev@postgres:5432/aahar
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: aahar_admin
      MINIO_SECRET_KEY: aahar_minio_dev
      MINIO_USE_SSL: "false"
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      ENVIRONMENT: development
      LOG_LEVEL: debug
      SECRET_KEY: dev-secret-key-change-in-production
      MODEL_SIGNING_KEY: dev-model-key-change-in-production
    volumes:
      - ./cloud:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── MQTT ingestion worker ────────────────────────────────────────────────
  mqtt-worker:
    build:
      context: cloud
      dockerfile: Dockerfile
      target: development
    container_name: aahar-mqtt-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://aahar:aahar_dev@postgres:5432/aahar
      REDIS_URL: redis://redis:6379
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      ENVIRONMENT: development
    volumes:
      - ./cloud:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    command: python -m app.mqtt.worker

  # ─── Adminer — lightweight DB UI for dev ─────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: aahar-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - dev-tools  # Only start with: docker compose --profile dev-tools up

volumes:
  postgres_data:
  redis_data:
  minio_data:
  emqx_data:
  emqx_log:

networks:
  default:
    name: aahar-network
