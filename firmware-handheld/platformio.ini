; AAHAR Handheld NIR Scanner — PlatformIO Configuration
; Target: ESP32-S3-WROOM-1 N16R8 (16MB Flash, 8MB Octal PSRAM)

[platformio]
default_envs = aahar_pro, aahar_lite
src_dir = src
include_dir = include

[env]
platform = espressif32 @ 6.5.0
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_mode = opi
board_build.flash_size = 16MB
board_build.psram_type = opi

build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCONFIG_SPIRAM_TYPE_ESP32S3=1
    -DCONFIG_SPIRAM_SIZE=8388608
    -Iinclude
    -Iinclude/contracts
    -Idrivers
    -Ioptics
    -Ible
    -Ipower
    -Isrc

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

[env:aahar_pro]
build_flags = 
    ${env.build_flags}
    -DAAHAR_SKU_PRO=1
    -DAAHAR_HAS_HAMAMATSU_C12880MA=1
    -DAAHAR_HAS_OV5640_CAMERA=1
    -DAAHAR_HAS_UV_365NM=1

[env:aahar_lite]
build_flags = 
    ${env.build_flags}
    -DAAHAR_SKU_LITE=1
    -DAAHAR_HAS_AS7265X_TRIAD=1
    -DAAHAR_HAS_OV5640_CAMERA=0
    -DAAHAR_HAS_UV_365NM=0
