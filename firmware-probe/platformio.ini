; AAHAR Silage Probe Node — PlatformIO Configuration
; Target: ESP32-C6-WROOM-1 (RISC-V, LoRaWAN + BLE 5.0)

[platformio]
default_envs = aahar_probe
src_dir = src
include_dir = include

[env:aahar_probe]
platform = espressif32 @ 6.5.0
framework = espidf
board = esp32-c6-devkitc-1
monitor_speed = 115200
board_build.partitions = partitions.csv

build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -Iinclude
    -Iinclude/contracts
    -Isensors
    -Ilora
    -Ipower
    -Isrc
    -DCONFIG_LORA_BAND_IN865=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
