%% AAHAR EMQX Access Control List
%%
%% PREVIOUS RULE (removed):
%%     {allow, all, publish, ["aahar/+/+/reading"]}.
%% Any client that could reach the broker could publish a silage reading for
%% ANY farm_id and ANY probe_id. Combined with the ingestion worker taking
%% farm_id straight from the topic, that allowed arbitrary injection into any
%% farm's permanent record, the spoilage forecast and the alert console.
%%
%% Probes now authenticate with a per-device client certificate. EMQX
%% substitutes the certificate Common Name into ${clientid}, so a probe can
%% only publish to its own topic.

%% Ingestion worker: subscribe only. It has no reason to publish telemetry.
{allow, {user, "aahar_worker"}, subscribe, ["aahar/#"]}.
{deny,  {user, "aahar_worker"}, publish,   ["aahar/#"]}.

%% A probe may publish ONLY to its own topic, keyed on its authenticated id.
{allow, {clientid, {re, "^probe-[a-zA-Z0-9-]+$"}}, publish, ["aahar/+/${clientid}/reading"]}.

%% Probes may receive their own command/OTA topic and nothing else.
{allow, {clientid, {re, "^probe-[a-zA-Z0-9-]+$"}}, subscribe, ["aahar/+/${clientid}/cmd"]}.

%% Probes must never subscribe to other devices' telemetry.
{deny,  {clientid, {re, "^probe-.*$"}}, subscribe, ["aahar/#"]}.

%% Alert fan-out to the dashboard bridge.
{allow, {user, "aahar_bridge"}, subscribe, ["aahar/alerts/#"]}.

%% Default deny.
{deny, all}.
